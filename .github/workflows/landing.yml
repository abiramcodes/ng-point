name: Deploy landing page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/landing.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, per GitHub's canonical Pages pattern. deploy-pages resolves the
# "github-pages" artifact through an eventually-consistent API; running it in
# a separate job (needs: build) lets the listing settle instead of racing
# the upload (actions/deploy-pages#451, #418).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
